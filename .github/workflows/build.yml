
name: Extract Minecraft Source

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          rm -rf extracted-source
          mkdir -p extracted-source
          unzip -q orchard-1.21.11-kinda-src.zip -d extracted-source

      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A extracted-source

          if ! git diff --cached --quiet; then
            git commit -m "Extract Minecraft source"
            git push
          fi

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: extracted-source
          path: extracted-source/
